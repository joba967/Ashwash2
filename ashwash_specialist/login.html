<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwash Specialist Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="fa-solid fa-user-doctor text-white"></i></div>
            <h3 class="fw-bold text-white mb-1">Ashwash Specialist Portal</h3>
            <p class="text-secondary small">Doctor & Mental Health Specialist Login</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none border-0 bg-danger bg-opacity-25 text-danger rounded-3 py-2 px-3 mb-3 small"></div>

        <form id="specialistLoginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control text-white" placeholder="e.g. dr_mekhala" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control text-white" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-purple w-100 mb-3 py-3 fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Specialist Workstation</button>
        </form>

        <div class="text-center mt-3">
            <p class="text-secondary small mb-0">New Specialist? <a href="register.html" class="text-decoration-none fw-semibold" style="color: #A855F7;">Apply for Specialist Account &rarr;</a></p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
