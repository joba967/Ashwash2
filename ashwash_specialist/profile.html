<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Specialist Profile & Account - Ashwash Workstation</title>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'index.html';
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg border-bottom border-secondary border-opacity-25 bg-dark px-4 py-3 sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center text-white fw-bold fs-5" href="dashboard.html">
                <span class="bg-primary rounded-3 p-2 me-2 d-inline-flex"><i class="fa-solid fa-user-doctor text-white"></i></span>
                Ashwash Specialist Workstation
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-3"><i class="fa-solid fa-arrow-left me-1"></i> Back to Workstation</a>
                <button class="btn btn-outline-danger btn-sm rounded-3" onclick="logoutSpecialist()"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 950px;">
        <div class="row g-4">
            <!-- Left Side: Avatar & Doctor Summary Card -->
            <div class="col-md-4">
                <div class="card-custom p-4 text-center h-100 d-flex flex-column align-items-center">
                    <div class="position-relative mb-3" title="Click to zoom full picture">
                        <div class="avatar-container" onclick="openZoomAvatarModal()">
                            <img id="profileAvatarImg" src="https://ui-avatars.com/api/?name=Dr+Specialist&background=A855F7&color=fff&size=140" alt="Profile Picture" onerror="handleAvatarError(this)">
                        </div>
                        <span class="position-absolute bottom-0 end-0 bg-success p-2 border border-2 border-dark rounded-circle" title="Verified Specialist" style="transform: translate(-10px, -5px);"></span>
                    </div>

                    <input type="file" id="specPhotoInput" accept="image/*" class="d-none" onchange="uploadProfilePhoto(this)">

                    <button type="button" class="btn btn-purple btn-sm rounded-pill px-4 py-2 mb-3 fw-bold shadow text-white" id="btnPhotoAction" onclick="document.getElementById('specPhotoInput').click()">
                        <i class="fa-solid fa-camera me-2 text-white"></i><span id="photoBtnText" class="text-white">Add Profile Photo</span>
                    </button>

                    <h5 class="fw-bold text-white mb-1" id="displayFullName">Dr. Specialist</h5>
                    <p class="text-secondary small mb-2" id="displaySpecialization">Clinical Psychologist</p>
                    <span class="badge bg-success bg-opacity-25 text-success px-3 py-2 rounded-pill mb-4"><i class="fa-solid fa-circle-check me-1"></i> Verified & Active</span>
                    
                    <hr class="border-secondary border-opacity-25 my-3 w-100">

                    <div class="text-start small w-100">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-secondary">License No:</span>
                            <span class="text-warning fw-mono" id="displayLicense">BMDC-REG-98234</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-secondary">Qualification:</span>
                            <span class="text-white fw-semibold" id="displayQualification">MSc Psychology</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Profile Details & Password Forms -->
            <div class="col-md-8">
                <div id="specAlertBox" class="alert d-none border-0 rounded-3 py-3 px-4 mb-4 small"></div>

                <!-- Form 1: Specialist Profile Information -->
                <div class="card-custom p-4 mb-4">
                    <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-user-doctor me-2" style="color: #A855F7;"></i> Specialist Credentials & Profile Info</h5>
                    <form id="specProfileInfoForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Doctor Full Name</label>
                            <input type="text" id="specFullName" class="form-control text-white" required placeholder="e.g. Dr. Mekhala Sarkar">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">Username</label>
                                <input type="text" id="specUsername" class="form-control text-white" required placeholder="dr_mekhala">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">Email Address</label>
                                <input type="email" id="specEmail" class="form-control text-white" required placeholder="doctor@ashwash.com">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">Specialization</label>
                                <input type="text" id="specSpecialization" class="form-control text-white" required placeholder="Clinical Psychologist">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">Qualification</label>
                                <input type="text" id="specQualification" class="form-control text-white" required placeholder="MSc in Clinical Psychology">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-purple rounded-3 px-4 py-2 fw-semibold text-white"><i class="fa-solid fa-floppy-disk me-2"></i> Update Profile Info</button>
                    </form>
                </div>

                <!-- Form 2: Change Password & Security -->
                <div class="card-custom p-4">
                    <h5 class="fw-bold text-white mb-3"><i class="fa-solid fa-lock me-2 text-warning"></i> Security & Password Settings</h5>
                    <form id="specChangePasswordForm">
                        <!-- Current Password Verification -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Current / Previous Password <span class="text-danger">* (Required for verification)</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-key"></i></span>
                                <input type="password" id="specCurrentPassword" class="form-control text-white" required placeholder="Enter current password">
                                <button class="btn btn-outline-secondary border-opacity-25" type="button" onclick="togglePasswordVisibility('specCurrentPassword', 'eyeCurrent')">
                                    <i class="fa-solid fa-eye text-secondary" id="eyeCurrent"></i>
                                </button>
                            </div>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="specNewPassword" class="form-control text-white" required placeholder="••••••••">
                                <button class="btn btn-outline-secondary border-opacity-25" type="button" onclick="togglePasswordVisibility('specNewPassword', 'eyeNew')">
                                    <i class="fa-solid fa-eye text-secondary" id="eyeNew"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm New Password -->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-check-double"></i></span>
                                <input type="password" id="specConfirmPassword" class="form-control text-white" required placeholder="••••••••">
                                <button class="btn btn-outline-secondary border-opacity-25" type="button" onclick="togglePasswordVisibility('specConfirmPassword', 'eyeConfirm')">
                                    <i class="fa-solid fa-eye text-secondary" id="eyeConfirm"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning rounded-3 px-4 py-2 fw-semibold"><i class="fa-solid fa-shield-halved me-2"></i> Update Security Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Zoom Full Specialist Profile Photo -->
    <div class="modal fade" id="zoomAvatarModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-secondary text-center">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-white"><i class="fa-solid fa-expand me-2 text-purple" style="color: #A855F7;"></i> Specialist Profile Photo (Full View)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 d-flex align-items-center justify-content-center">
                    <img id="zoomedAvatarImg" src="" alt="Full Profile Photo" class="img-fluid rounded-4 shadow-lg border border-2 border-purple" style="max-height: 80vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSpecialistProfile();

            const infoForm = document.getElementById('specProfileInfoForm');
            if (infoForm) {
                infoForm.addEventListener('submit', handleSpecProfileInfoSubmit);
            }

            const passForm = document.getElementById('specChangePasswordForm');
            if (passForm) {
                passForm.addEventListener('submit', handleSpecChangePasswordSubmit);
            }
        });

        function openZoomAvatarModal() {
            const img = document.getElementById('profileAvatarImg');
            const zoomedImg = document.getElementById('zoomedAvatarImg');
            if (img && zoomedImg) {
                zoomedImg.src = img.src;
                const modal = new bootstrap.Modal(document.getElementById('zoomAvatarModal'));
                modal.show();
            }
        }

        function handleAvatarError(img) {
            const fullName = document.getElementById('displayFullName')?.textContent || 'Specialist';
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=A855F7&color=fff&size=140`;
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
