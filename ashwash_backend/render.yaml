databases:
  - name: ashwash-db
    databaseName: ashwash
    user: ashwash_admin
    plan: free

services:
  - type: web
    name: ashwash-backend
    env: python
    rootDir: ashwash_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn ashwash_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: ashwash-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
