<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwash Admin Executive Portal - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Outfit', sans-serif; }
        body {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F8FAFC;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .brand-badge {
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #FFFFFF;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            color: #FFFFFF;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="fa-solid fa-user-shield text-white"></i></div>
            <h3 class="fw-bold text-white mb-1">Ashwash Admin Portal</h3>
            <p class="text-secondary small">System Administrator & Executive Access</p>
        </div>

        {% if error %}
        <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-danger rounded-3 py-2 px-3 mb-3 small">
            <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Admin Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-user-gear"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="e.g. admin or superuser" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Admin Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-gradient w-100 mb-3"><i class="fa-solid fa-shield-halved me-2"></i> Log In to Executive Admin</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'specialist_login' %}" class="text-secondary small text-decoration-none">&larr; Specialist Login Portal</a>
        </div>
    </div>
</body>
</html>
