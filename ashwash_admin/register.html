<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Executive Admin - Ashwash Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="login-card" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="fa-solid fa-user-shield text-white"></i></div>
            <h3 class="fw-bold text-white mb-1">Register Executive Admin</h3>
            <p class="text-secondary small">Create a System Administrator Account</p>
        </div>

        <div id="alertBox" class="alert d-none border-0 rounded-3 py-2 px-3 mb-3 small"></div>

        <form id="adminRegisterForm">
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label text-secondary small fw-semibold">First Name</label>
                    <input type="text" id="regFirstName" class="form-control text-white" placeholder="Admin" required>
                </div>
                <div class="col-6">
                    <label class="form-label text-secondary small fw-semibold">Last Name</label>
                    <input type="text" id="regLastName" class="form-control text-white" placeholder="User" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Admin Username</label>
                <input type="text" id="regUsername" class="form-control text-white" placeholder="admin_super" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Admin Email</label>
                <input type="email" id="regEmail" class="form-control text-white" placeholder="admin@ashwash.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Password</label>
                <input type="password" id="regPassword" class="form-control text-white" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-blue w-100 mb-3 py-3 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Create Administrator Account</button>
        </form>

        <div class="text-center mt-3">
            <a href="login.html" class="text-secondary small text-decoration-none">&larr; Already an Admin? Login</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
