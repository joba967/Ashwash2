<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwash Executive Admin Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge"><i class="fa-solid fa-user-shield text-white"></i></div>
            <h3 class="fw-bold text-white mb-1">Ashwash Admin Portal</h3>
            <p class="text-secondary small">System Administrator & Executive Access</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none border-0 bg-danger bg-opacity-25 text-danger rounded-3 py-2 px-3 mb-3 small"></div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-user-gear"></i></span>
                    <input type="text" id="username" class="form-control text-white" placeholder="e.g. admin" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" class="form-control text-white" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-blue w-100 mb-3 py-3 fw-bold"><i class="fa-solid fa-shield-halved me-2"></i> Log In to Executive Admin</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
